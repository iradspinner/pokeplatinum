<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Before any stylesheet, so the browser knows both schemes are supported. -->
<meta name="color-scheme" content="light dark">
<title>Encounter Tool</title>
<link rel="stylesheet" href="theme.css">
<!-- Blocking on purpose: it pins a chosen scheme before the first paint. -->
<script src="theme.js"></script>
<style>
/* A cold instrument, not a dashboard. Every colour comes from theme.css, where
   each hue has one meaning: teal is probability mass, pink is place, gold is
   the one number worth acting on, red is a lint error and orange-brown a lint
   warning. Anything already caught is drawn as absence rather than in another
   colour. This file holds layout and type only, and no colour literal at all;
   the colours and the three faces are in theme.css. */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font: 16px/1.5 var(--sans);
  display: flex; flex-direction: column;
}
.num { font-family: var(--mono); font-variant-numeric: tabular-nums;
       text-align: right; white-space: nowrap; }
/* Teal means probability mass and nothing else, so a link is neutral ink
   with an underline, and turns to place on hover. */
a { color: var(--ink); text-decoration-color: var(--faint); }
a:hover { color: var(--place-ink); text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--mass); outline-offset: 1px; }

header {
  display: flex; align-items: center; gap: 16px; flex-wrap: nowrap;
  min-height: 44px; padding: 4px 16px; background: var(--panel);
  border-bottom: 1px solid var(--rule); flex: none;
}
/* the pixel face is identity: the title, the tabs, the headline, the number */
header .title { font: 600 18.5px/1 var(--pixel); margin-right: 4px; white-space: nowrap; }
header .title .ox { color: var(--place-ink); }
/* The metric strip is the flexible gap: it takes the room between the tabs
   and the checkout, and when there is not enough it wraps inside itself, so
   the title, the tabs, the checkout and the toggle always hold the first row
   rather than being stranded on a second one. */
header .strip { display: flex; align-items: center; gap: 4px 16px; flex-wrap: wrap;
                flex: 1 1 auto; min-width: 0; padding: 4px 0; }
header > nav, header > .title, header > .checkout, header > button { flex: none; }
header .checkout { font: 14.5px/1 var(--mono); color: var(--faint); white-space: nowrap; }
.metric { color: var(--dim); font-size: 15px; white-space: nowrap; }
.metric b { font-family: var(--mono); font-variant-numeric: tabular-nums;
            color: var(--ink); font-weight: 600; margin-left: 4px; }
.metric.fail b { color: var(--error); }
.metric.pass b { color: var(--mass); }

main { display: grid; grid-template-columns: 460px minmax(520px, 1fr) 400px;
       flex: 1; min-height: 0; }
section { overflow-y: auto; }
#list { border-right: 1px solid var(--rule); background: var(--panel); }
#right { border-left: 1px solid var(--rule); background: var(--panel); }
#mid { padding: 14px 20px 40px; font-size: 18px; }
#mid table.grid td { padding: 2px 8px; }
/* The centre's party icons are drawn at twice size (64px, still whole
   pixels), so its rows are 68px; no zebra, the sunken tone on hover. */
#mid table.grid tbody tr { height: 68px; }
#mid .ico { width: 64px; height: 64px; }
#mid .ico img { width: 64px; height: 128px; }
/* The slot table and "What a player meets" sit side by side, rows level with
   each other, so the list carries no heading of its own and the slot table
   no odds column (Ian, 2026-09-22). When the column is too narrow for both,
   the list wraps below. */
#mid .tables { display: flex; flex-wrap: wrap; align-items: flex-start;
               gap: 0 32px; margin-top: 4px; }
#mid .tables > table.slots { flex: none; }
#mid .meets { flex: 1 1 340px; min-width: 0; }
/* Each line of "What a player meets" is two rows beside its icon: the name
   and both odds on top, and the bar under them across the full width, so the
   bar keeps its length even when the column is narrow. */
#mid .meet { display: grid; grid-template-columns: 64px 1fr auto auto;
             column-gap: 14px; align-items: center; min-height: 68px;
             padding: 2px 8px; border-bottom: 1px solid var(--rule); }
#mid .meet:hover:not(.head) { background: var(--sunken); }
#mid .meet .ico { grid-row: 1 / 3; }
#mid .meet .num { min-width: 4.2em; }
#mid .meet .paper { color: var(--faint); }
#mid .meet .bar { grid-column: 2 / 5; align-self: start; }
#mid .meet.head { min-height: 0; padding: 4px 8px; font-size: 15px; font-weight: 600;
                  color: var(--dim); align-items: end; }
#mid .meet.head .num { font-family: inherit; }
#mid .meet.gone { color: var(--faint); }
#mid .meet.gone .spname { text-decoration: line-through; }
#mid .meet.gone .ico { opacity: .35; }
#mid .meets .bar span { transition: width .35s ease; }
/* Grass rows are 46px, the 64px icon overhanging into the rows' padding: its
   sprite sits in the middle of a mostly clear frame, and the shorter rows make
   the twelve slots about as tall as the odds list beside them. */
#mid table.slots tbody tr { height: 46px; }
#mid table.slots .ico { margin: -9px 0; }
/* The water tables in brief, four across, wrapping on a narrow column. */
#mid .water { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
              gap: 12px; margin-top: 18px; }
#mid .wpanel { border: 1px solid var(--rule); border-radius: 3px; padding: 6px 10px 8px;
               background: var(--panel); cursor: pointer; }
#mid .wpanel:hover { border-color: var(--mass); }
#mid .wpanel.on { border-color: var(--place-ink); box-shadow: inset 0 3px 0 var(--place-ink);
                  cursor: default; }
#mid .wtitle { display: flex; justify-content: space-between; align-items: baseline;
               font-weight: 600; border-bottom: 1px solid var(--rule); padding-bottom: 4px; }
#mid .wrow { display: grid; grid-template-columns: 34px 48px 1fr auto; column-gap: 6px;
             align-items: center; height: 40px; font-size: 16px; }
#mid .wrow .rate { color: var(--dim); }
#mid .wrow .spname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#mid .wrow .ico { width: 48px; height: 48px; margin: -4px 0; }
#mid .wrow .ico img { width: 48px; height: 96px; }
#mid .wrow.gone { color: var(--faint); }
#mid .wrow.gone .spname { text-decoration: line-through; }
#mid .wrow.gone .ico { opacity: .35; }
#mid table.grid tbody tr:hover { background: var(--sunken); }
#mid td.rate { color: var(--dim); }
#mid table.grid th { font-size: 15px; }
#mid input.lv { width: 60px; font-size: 17.5px; }
#mid .cb { width: 11.5em; }
#mid .cb input { font-size: 17.5px; }
#mid table.grid { width: auto; }
#mid table.grid td.fill { width: 100%; }
/* The encounter reads as one line at the heading's right, so the heading
   takes three short rows above the tables rather than five. */
.encounter { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.encounter .k { font-size: 15px; color: var(--dim); }
.encounter .v { font: 600 20.5px/1.1 var(--sans); letter-spacing: -.01em;
                display: inline-flex; align-items: center; gap: 6px; }
.encounter .v.none { color: var(--faint); font-weight: 400; font-size: 18px; }
#mid .encounter .ico { width: 32px; height: 32px; }
#mid .encounter .ico img { width: 32px; height: 64px; }
#right { padding: 0 16px 40px; }

/* the filter stays put however far the list is scrolled */
.listhead { position: sticky; top: 0; z-index: 10; background: var(--panel);
            padding: 12px 12px 8px; border-bottom: 1px solid var(--rule); }
#filter { width: 100%; }
.sortbar { margin-top: 7px; font-size: 14.5px; color: var(--dim);
           display: flex; gap: 4px; flex-wrap: wrap; }
.sortbar button {
  border: 1px solid transparent; background: none; color: var(--dim); cursor: pointer;
  padding: 0 8px; border-radius: 3px; font: inherit;
}
.sortbar button:hover { background: var(--sunken); }
/* Every "on" state is place: the sort bar, the Grass, Surf and rod tabs, the
   time of day, the view tabs. Teal used to fill them, and teal is mass. */
.sortbar button.on, .kinds button.on, #views button.on {
  background: var(--place-bg); color: var(--place-ink); border-color: var(--place-ink);
}

input, button, select {
  font: inherit; color: var(--ink); background: var(--panel);
  border: 1px solid var(--rule); border-radius: 3px; padding: 3px 6px;
}
button { cursor: pointer; background: var(--panel); }
button:hover:not(:disabled) { border-color: var(--mass); }
button:disabled { color: var(--faint); cursor: default; }

/* Left list: a real table so the numbers line up down the column. The name
   has the whole first line to itself, so it is never cut short; the split
   tag, the catch and the numbers share the second, under labelled columns. */
.colhead, .arow { grid-template-columns: 1fr 104px 76px 56px 48px; }
.colhead { display: grid; gap: 4px; margin-top: 8px; font-size: 13px;
           color: var(--dim); align-items: end; line-height: 1.2; }
.colhead .num { font-family: inherit; white-space: normal; }
.arow {
  display: grid;
  gap: 2px 4px; align-items: center; min-height: 44px; padding: 4px 12px; cursor: pointer;
  border-bottom: 1px solid var(--rule); position: relative;
}
.arow .l2 { display: flex; gap: 4px; align-items: center; }
.arow .enc { display: flex; align-items: center; gap: 4px; }
.arow .enc .ico { margin: -4px 0; }
.arow:hover { background: var(--sunken); }
.arow.sel { background: var(--place-bg); box-shadow: inset 3px 0 0 var(--place-ink); }
.arow .l1 { grid-column: 1 / -1; }
.arow .l2 { min-width: 0; }
.arow .sub { font-size: 14px; color: var(--faint); }
.arow .num { font-size: 14.5px; color: var(--dim); }
.arow .enc span.lbl { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.arow .enc.none { color: var(--faint); }
/* progress is shown by fading the row, so a partly-worked area reads as
   partly done rather than as a binary flag */
.arow.p1 { opacity: .78; } .arow.p2 { opacity: .60; } .arow.p3 { opacity: .45; }
.arow.done { opacity: .38; }
.arow.done .l1 { text-decoration: line-through; }
.flag { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
        margin-right: 6px; background: transparent; vertical-align: middle; }
.flag.err { background: var(--error); }
.flag.wrn { background: var(--warn); }

h2 { font: 600 15px/1.3 var(--sans); color: var(--dim); margin: 20px 0 7px;
     padding-bottom: 4px; border-bottom: 1px solid var(--rule); }
#right h2:first-child { margin-top: 14px; }

table.grid { border-collapse: collapse; width: 100%; }
table.grid th { text-align: left; font-weight: 600; font-size: 14px;
  color: var(--dim); padding: 4px 7px; border-bottom: 1px solid var(--rule); }
table.grid th.num { text-align: right; }
table.grid td { padding: 2px 7px; border-bottom: 1px solid var(--rule); }
tr.gone td { color: var(--faint); }
tr.gone .spname { text-decoration: line-through; }
input.lv { width: 48px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.ck { cursor: pointer; }

/* the ladder is the one loud thing in here: each rung is the surviving mass,
   drawn to scale, with caught species hollow so you watch it redistribute */
.rung { margin: 0 0 11px; }
.rung .cap { display: flex; justify-content: space-between; gap: 8px;
             font-size: 14.5px; color: var(--dim); margin-bottom: 3px; }
.rung .cap .lead { color: var(--ink); font-weight: 600; }
.rung .cap .lead.best { color: var(--act); }
.bar { display: flex; height: 22px; border: 1px solid var(--rule);
       border-radius: 3px; overflow: hidden; background: var(--panel); }
/* Each segment's text colour is worked out per segment from the fill it sits
   on, because the fills differ between the two themes; see segText(). */
.bar span {
  display: flex; align-items: center; justify-content: center;
  font: 13.5px/1 var(--mono); overflow: hidden;
  border-right: 1px solid var(--panel);
}
.bar span:last-child { border-right: 0; }
/* When a species is ticked its share goes to the rest; the widths ease over
   200ms so that redistribution can be watched. Reduced motion turns it off,
   through the global rule further down. */
.bar span { transition: width .2s ease; }
.bar span.gone {
  background: repeating-linear-gradient(135deg, var(--panel) 0 3px, var(--sunken) 3px 6px);
  color: var(--faint);
}
.legend { font-size: 14px; color: var(--dim); margin-top: 3px;
          display: flex; flex-wrap: wrap; gap: 3px 10px; }
.legend s { color: var(--faint); }

.headline { font: 600 30.5px/1.1 var(--pixel); }
.headline.good { color: var(--act); }
.headline.bad { color: var(--error); }
.sub { font-size: 15px; color: var(--dim); }
.kinds { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin: 8px 0 6px; }
.kinds .kgap { width: 12px; }
.kinds > .sub { margin-left: 8px; }
.kinds button[data-layer] { font: 600 15.5px/1.4 var(--pixel); }

.aname { font: 650 20.5px/1.2 var(--sans); }
/* Before an area is chosen, one party icon from the pick-list keeps the empty
   column company, faded, and a different one each load. */
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px;
         margin-top: 96px; }
.empty .ico { opacity: .4; }
.tag { font-size: 14px; color: var(--dim); background: var(--sunken);
       border-radius: 3px; padding: 1px 6px; }
.finding { padding: 5px 0; border-bottom: 1px solid var(--rule); font-size: 15px; }
.finding .rule { font-family: var(--mono); color: var(--warn); margin-right: 5px; }
.finding.error .rule { color: var(--error); }
.finding .asp { color: var(--faint); }

.plan ol { margin: 6px 0 0; padding-left: 20px; }
.plan li { margin: 0 0 8px; font-size: 15px; }
.plan li b { color: var(--act); font-weight: 600; }
.plan .pick { display: flex; gap: 6px; align-items: center; }
.plan select { flex: 1; }
#toast { position: fixed; right: 16px; bottom: 14px; background: var(--ink);
         color: var(--ground); border-radius: 4px; padding: 7px 12px; font-size: 15px;
         opacity: 0; transition: opacity .12s; pointer-events: none; z-index: 60; }
#toast.on { opacity: 1; }
#toast.err { background: var(--error); color: var(--on-mass); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* combobox over the whole dex: type to filter, or open it to browse */
.cb { position: relative; display: block; }
.cb input { width: 100%; padding-right: 20px; }
.cb .caret { position: absolute; right: 5px; top: 3px; color: var(--faint);
             cursor: pointer; font-size: 11.5px; user-select: none; }
.cb .menu { display: none; position: fixed; z-index: 50; background: var(--panel);
            border: 1px solid var(--mass); border-radius: 3px;
            max-height: 264px; overflow-y: auto; min-width: 190px;
            box-shadow: 0 8px 20px var(--shadow); }
.cb.open .menu { display: block; }
.cb .menu div { padding: 3px 9px; cursor: pointer; white-space: nowrap; }
.cb .menu div.on, .cb .menu div:hover { background: var(--sunken); }

/* ---- the dex view ------------------------------------------------------ */
/* main is a grid, and an author display rule beats the hidden attribute's own
   display:none, so hiding a view takes a rule that outranks `main`. Without
   this both views draw, one below the other. */
main[hidden] { display: none; }

/* A species reads faster with its sprite beside it, in the tables as much as
   in the dex. The cells become flex rows so the icon sits against the name
   rather than on its own line. */
#mid td.spname { display: flex; align-items: center; gap: 8px; }
#mid td.spname .ico { margin-left: -2px; }
tr.gone .ico { opacity: .35; }

#views { display: flex; gap: 0; margin-right: 6px; }
#views button { font: 600 15.5px/1.4 var(--pixel); padding: 2px 12px;
  border: 1px solid var(--rule); background: var(--panel); color: var(--dim);
  cursor: pointer; }
#views button:first-child { border-radius: 3px 0 0 3px; }
#views button:last-child { border-radius: 0 3px 3px 0; border-left: 0; }


#dexlist { border-right: 1px solid var(--rule); background: var(--panel); }
#dexright { border-left: 1px solid var(--rule); background: var(--panel);
  padding: 12px 14px 40px; }
#dexmid { padding: 14px 20px 40px; font-size: 18px; }

/* The sprites are frame sheets: a front or back is two 80x80 frames side by
   side, a party icon is two 32x32 frames stacked. Both show their first. */
.spr, .ico { overflow: hidden; display: inline-block; vertical-align: middle;
  flex: none; }
.spr { width: 80px; height: 80px; }
.spr img { width: 160px; height: 80px; display: block; image-rendering: pixelated; }
.ico { width: 32px; height: 32px; }
.ico img { width: 32px; height: 64px; display: block; image-rendering: pixelated; }

.dexrow { display: flex; align-items: center; gap: 8px; min-height: 36px;
  padding: 2px 12px; cursor: pointer; border-bottom: 1px solid transparent; }
.dexrow:hover { background: var(--sunken); }
/* the species being viewed is place, like the selected area */
.dexrow.on { background: var(--place-bg); box-shadow: inset 3px 0 0 var(--place-ink); }
.dexrow .nm { flex: 1; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.dexrow .tt { white-space: nowrap; }
.dexrow.is-new .nm::after { content: " new"; color: var(--place-ink);
  font-size: 13.5px; }

/* A type chip blends its type colour into the panel rather than using it at
   full strength, so ink stays readable on all eighteen. light-dark() takes only
   colours, so the blend strength cannot be a token; the rule wraps two
   color-mix() calls instead. Gym-split tags borrow the leader's type the same
   way. A plain chip is neutral, and a place chip marks the hidden ability. */
.chip {
  --t: var(--type-normal);
  display: inline-block; margin-right: 4px;
  background: light-dark(color-mix(in srgb, var(--t) 24%, var(--panel)),
                         color-mix(in srgb, var(--t) 34%, var(--panel)));
  border: 1px solid color-mix(in srgb, var(--t) 60%, var(--panel));
  color: var(--ink);
  border-radius: 999px; padding: 0 7px; font-size: 14px; font-weight: 600;
  line-height: 1.5; white-space: nowrap;
}
.chip.plain { background: var(--panel); border-color: var(--rule); font-weight: 400; }
.chip.place { background: var(--place-bg); border-color: var(--place-ink); color: var(--place-ink); }
.chip.mini { font-size: 13px; padding: 0 5px; margin-right: 2px; }

table.stats { border-collapse: collapse; width: 100%; max-width: 460px; }
table.stats td { padding: 2px 6px; }
/* Not `.bar`: that class is the repel ladder's bordered 22px row, and
   borrowing it drew every stat as an empty box. */
table.stats td.meter { width: 100%; }
table.stats .track { background: var(--sunken); height: 9px; border-radius: 2px; }
table.stats .track > i { display: block; height: 100%; border-radius: 2px; }
/* A stat reads faster as a colour than as a number, so the bar is banded the
   way a dex bands it. Muted, to sit beside the teal rather than shout over it. */
.s0 { background: var(--stat-0); }
.s1 { background: var(--stat-1); }
.s2 { background: var(--stat-2); }
.s3 { background: var(--stat-3); }
.s4 { background: var(--stat-4); }

.met.go { cursor: pointer; }
.met.go:hover { background: var(--sunken); }
.met .arrow { color: var(--faint); float: right; }
table.facts { border-collapse: collapse; font-size: 15.5px; }
table.facts th { text-align: left; font-weight: 500; color: var(--dim);
  padding: 1px 12px 1px 0; white-space: nowrap; }
table.facts td { padding: 1px 0; }
/* A stat change is information, not the one number to act on, so it never
   takes gold: teal when up, dim when down. */
.delta { font-family: var(--mono); color: var(--mass); font-size: 14.5px; }
.delta.down { color: var(--dim); }

/* The species page's one loud element: the front sprite at twice size,
   standing on the ellipse the DS draws under a battler. */
.stage { position: relative; width: 176px; height: 176px; flex: none;
  background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; }
.stage::before { content: ""; position: absolute; left: 28px; bottom: 16px;
  width: 120px; height: 24px; border-radius: 50%; background: var(--sunken); }
.stage .spr { position: absolute; left: 8px; top: 4px; width: 160px; height: 160px; }
.stage .spr img { width: 320px; height: 160px; }
.dexnum { font: 600 18.5px/1 var(--pixel); color: var(--faint); }
.species-name { font: 650 24.5px/1.2 var(--sans); margin: 4px 0 8px; }

/* Damage taken: the eighteen types, six by three. Weaknesses take the warm end
   of the stat bands and resistances the cool end, so this grid and the stat
   bars agree on what warm and cool mean. An immunity is drawn as absence. */
.mxgrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.mxcell { display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 4px 0; border: 1px solid transparent; border-radius: 3px; }
.mxcell .m { font: 600 14px/1 var(--mono); }
.mxcell.x4 { background: color-mix(in srgb, var(--stat-0) 45%, var(--panel)); }
.mxcell.x2 { background: color-mix(in srgb, var(--stat-0) 24%, var(--panel)); }
.mxcell.x1 .m { color: var(--faint); font-weight: 400; }
.mxcell.x05 { background: color-mix(in srgb, var(--stat-4) 24%, var(--panel)); }
.mxcell.x025 { background: color-mix(in srgb, var(--stat-4) 45%, var(--panel)); }
.mxcell.x0 { border: 1px dashed var(--rule); }

.dexsec { margin-top: 18px; }
.dexsec > h4 { margin: 0 0 8px; font-size: 15px; font-weight: 600;
  color: var(--dim); text-transform: lowercase; letter-spacing: .03em; }
.evoline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.evoline .arrow { color: var(--faint); font-size: 16.5px; }
/* the stage being viewed is place */
.evoline a.here { text-decoration: underline 2px var(--place-ink); text-underline-offset: 3px; }
.learn { border-collapse: collapse; font-size: 15.5px; }
.learn td, .learn th { padding: 1px 8px 1px 0; }
.learn th { color: var(--dim); font-weight: 600; font-size: 14.5px;
  text-align: left; }
.met { margin-bottom: 7px; padding-bottom: 6px;
  border-bottom: 1px solid var(--rule); }
.met b { font-weight: 600; }
.met .sub { color: var(--dim); font-size: 14.5px; }
.met .share { font-family: var(--mono); color: var(--mass); }
.mx { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.mx span { font-size: 14px; }
</style>
</head>
<body>
<header>
  <span class="title">Platinum <span class="ox">Oxide</span></span>
  <nav id="views">
    <button data-view="tables" class="on">Tables</button>
    <button data-view="dex">Dex</button>
  </nav>
  <div class="strip">
    <span class="metric">source <b id="h-ref">—</b></span>
    <span class="metric">areas <b id="h-n">—</b></span>
    <span class="metric" id="w-spread">route variety <b id="h-spread">—</b></span>
    <span class="metric" id="w-sig">distinct shapes <b id="h-sig">—</b></span>
    <span class="metric" id="w-arc">early to late <b id="h-arc">—</b></span>
    <span class="metric">repel pays <b id="h-up">—</b></span>
    <span class="metric" id="w-lint">problems <b id="h-lint">—</b></span>
    <span class="metric">caught <b id="h-caught">0</b></span>
    <button id="clear-caught" title="Clear the caught list">Reset caught</button>
  </div>
  <span class="checkout" id="h-root" title="Which checkout this server is reading">—</span>
  <button id="theme-toggle" data-theme-toggle>Dark</button>
</header>

<main>
  <section id="list">
    <div class="listhead">
      <input id="filter" placeholder="Find an area, or /starly to find its tables">
      <div class="sortbar">
        <button data-k="level" class="on">Play order</button>
        <button data-k="area">Name</button>
        <button data-k="live_total">Left to catch</button>
        <button data-k="best_share">Best odds</button>
        <button data-k="warns">Problems</button>
      </div>
      <div class="colhead">
        <span></span>
        <span title="The species recorded as this area's one catch">Caught</span>
        <span class="num" title="Lowest to highest level across the area's tables">Levels</span>
        <span class="num" title="Species you still need, out of every species across the area's tables">Left</span>
        <span class="num" title="Your best chance of meeting the rarest species you still need here, with the best repel lead">Best odds</span>
      </div>
    </div>
    <div id="rows"></div>
  </section>

  <section id="mid"><div class="empty"><span id="empty-icon"></span>
    <p class="sub">Choose an area to edit its tables.</p></div></section>
  <section id="right"></section>
</main>

<main id="dexmain" hidden>
  <section id="dexlist">
    <div class="listhead">
      <input id="dexfilter" placeholder="Find a species, or a type">
      <div class="sortbar">
        <button data-f="all" class="on">All</button>
        <button data-f="tables">In tables</button>
        <button data-f="changed">Changed</button>
        <button data-f="new">New</button>
      </div>
    </div>
    <div id="dexrows"></div>
  </section>
  <section id="dexmid"><p class="sub">Choose a species.</p></section>
  <section id="dexright"></section>
</main>
<div id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
const pct = v => !v ? "0%" : (v * 100).toFixed(v * 100 < 9.95 ? 1 : 0) + "%";

let ALL = [], GAME = null, DEX = [], BY_LABEL = new Map();
let SEL = null, DETAIL = null, CAUGHT = new Set();
let SORT = "level", KIND = "land", LAYER = "base";
let PLAN = null, PLAN_SP = null;
let KINDS = { land: "Grass" };

function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "on" + (bad ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.className = ""), bad ? 6000 : 1500);
}
async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ error: "the server sent something unreadable" }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

// ---- the dex ------------------------------------------------------------
// The species side of the tool. Everything here is served from res/ through
// /api/dex, so it is the same data the build consumes: no ROM is parsed and
// nothing is recomputed in the page.
let POKEDEX = [], DEXSEL = null, DEXDETAIL = null, DEXFILTER = "all";
// The eighteen types in the order the games list them, for the matchup grid.
const TYPES = ["NORMAL", "FIRE", "WATER", "ELECTRIC", "GRASS", "ICE", "FIGHTING",
  "POISON", "GROUND", "FLYING", "PSYCHIC", "BUG", "ROCK", "GHOST", "DRAGON",
  "DARK", "STEEL", "FAIRY"];
const STATS = [["hp","HP"],["attack","Attack"],["defense","Defense"],
               ["special_attack","Sp. Atk"],["special_defense","Sp. Def"],
               ["speed","Speed"]];
const sprite = (folder, kind) => `/api/sprite/${folder}/${kind}`;
// Every species folder in res/pokemon is its constant lowercased, checked for
// all 652. A sprite that is somehow missing hides rather than drawing the
// browser's broken-image glyph in the middle of a table.
const folderOf = sp => String(sp).replace("SPECIES_", "").toLowerCase();
const icon = sp => sp
  ? `<span class="ico"><img src="${sprite(folderOf(sp), "icon")}" alt="" loading="lazy"
       onerror="this.parentNode.style.visibility='hidden'"></span>`
  : "";
const tidy = t => t ? t[0] + t.slice(1).toLowerCase().replace(/_/g, " ") : "";

// A type chip names its type and tints itself with it; the colour is a token,
// so the chip follows the theme like everything else.
const typeChip = (t, cls = "") =>
  `<span class="chip ${cls}" style="--t: var(--type-${String(t).toLowerCase()})">${esc(tidy(t))}</span>`;

// Split tags borrow the gym leader's type, so the area list reads as the
// game's progression at a glance. The League is Cynthia's Garchomp; after the
// League there is no leader, so Post is a plain tag.
const SPLIT_TYPE = { Roark: "ROCK", Gardenia: "GRASS", Fantina: "GHOST",
  Maylene: "FIGHTING", Wake: "WATER", Byron: "STEEL", Candice: "ICE",
  Volkner: "ELECTRIC", League: "DRAGON" };
const splitTag = (split, suffix = "") => !split ? ""
  : SPLIT_TYPE[split]
    ? `<span class="chip mini" style="--t: var(--type-${SPLIT_TYPE[split].toLowerCase()})">${esc(split + suffix)}</span>`
    : `<span class="tag">${esc(split + suffix)}</span>`;
const signed = n => (n > 0 ? "+" : "") + n;

function dexMatch(r) {
  const q = ($("#dexfilter").value || "").trim().toLowerCase();
  if (q && !r.name.toLowerCase().includes(q)
        && !r.types.join(" ").toLowerCase().includes(q)) return false;
  if (DEXFILTER === "tables") return r.appearances > 0;
  if (DEXFILTER === "changed") return r.changed;
  if (DEXFILTER === "new") return r.new;
  return true;
}

function drawDexList() {
  const rows = POKEDEX.filter(dexMatch);
  $("#dexrows").innerHTML = rows.map(r => `
    <div class="dexrow${r.species === DEXSEL ? " on" : ""}${r.new ? " is-new" : ""}"
         data-sp="${r.species}">
      <span class="ico"><img src="${sprite(r.folder, "icon")}" alt="" loading="lazy"></span>
      <span class="nm">${esc(r.name)}</span>
      <span class="tt">${r.types.map(t => typeChip(t, "mini")).join("")}</span>
      <span class="num" style="width:3.2em">${r.bst}</span>
      <span class="delta${r.canon_delta < 0 ? " down" : ""}" style="width:3em"
            title="against this species' real Generation 9 self">${
        r.canon_delta ? signed(r.canon_delta) : ""}</span>
    </div>`).join("") || `<p class="sub" style="padding:10px 12px">Nothing matches.</p>`;
  $("#dexrows").querySelectorAll(".dexrow").forEach(el =>
    el.onclick = () => selectSpecies(el.dataset.sp));
}

async function selectSpecies(species) {
  DEXSEL = species;
  drawDexList();
  try {
    DEXDETAIL = await api("/api/dex/" + species);
  } catch (e) { return toast(e.message, true); }
  drawDexDetail();
}

// Bands a dex would recognise, so a glance at the colour says as much as
// reading the number does.
const band = v => v < 50 ? "s0" : v < 75 ? "s1" : v < 95 ? "s2" : v < 120 ? "s3" : "s4";

function statRows(d) {
  // Per stat, the comparison is against the real species: it is the one every
  // species has, including the 159 vanilla Platinum never saw.
  const delta = (d.canon && d.canon.stats) || {};
  return STATS.map(([k, label]) => {
    const v = d.stats[k], dv = delta[k];
    return `<tr>
      <td class="sub">${label}</td>
      <td class="num" style="width:3em">${v}</td>
      <td class="meter"><div class="track">
        <i class="${band(v)}" style="width:${Math.min(100, v / 200 * 100)}%"></i></div></td>
      <td class="delta${dv < 0 ? " down" : ""}" style="width:3.4em">${dv ? signed(dv) : ""}</td>
    </tr>`;
  }).join("");
}

// Grass Knot and Low Kick read the target's weight, so the page may as well
// say what they would do. The tree stores pounds.
function facts(d) {
  const kg = d.weight_pounds ? d.weight_pounds * 0.4536 : null;
  const knot = kg === null ? null
    : kg < 10 ? 20 : kg < 25 ? 40 : kg < 50 ? 60 : kg < 100 ? 80 : kg < 200 ? 100 : 120;
  const evs = Object.entries(d.ev_yields || {}).filter(([, v]) => v)
    .map(([k, v]) => `${v} ${(STATS.find(s => s[0] === k) || [, k])[1]}`).join(", ");
  const items = Object.entries(d.held_items || {})
    .filter(([, v]) => v && v !== "ITEM_NONE")
    .map(([k, v]) => `${k === "rare" ? "5%" : "50%"} ${tidy(v.replace("ITEM_", ""))}`)
    .join(", ");
  const row = (k, v) => v ? `<tr><th>${k}</th><td>${v}</td></tr>` : "";
  return `<table class="facts">
    ${row("catch rate", d.catch_rate)}
    ${row("gender", tidy(d.gender_ratio))}
    ${row("egg groups", (d.egg_groups || []).map(tidy).join(", "))}
    ${row("hatch cycles", d.hatch_cycles)}
    ${row("base friendship", d.base_friendship)}
    ${row("exp rate", tidy(d.exp_rate))}
    ${row("base exp", d.base_exp)}
    ${row("EV yield", evs)}
    ${row("wild item", items)}
    ${row("weight", kg === null ? "" : `${kg.toFixed(1)} kg
       <span class="sub">Grass Knot ${knot}</span>`)}
  </table>`;
}

function evoText(e) {
  if (e.level) return `level ${e.level}`;
  if (e.item) return tidy(e.item);
  return tidy(e.method);
}

function drawDexDetail() {
  const d = DEXDETAIL;
  if (!d) return;
  const front = d.sprites.male_front ? "male_front"
              : d.sprites.female_front ? "female_front" : null;
  const was = d.vanilla;
  const bstDelta = d.delta && d.delta.bst;
  // The dex number is the species' place in the tree, which is the national
  // number for the 493 natives and this project's own for the rest. The list
  // is in that order already, so no field is added to the API for it.
  const number = POKEDEX.findIndex(r => r.species === d.species) + 1;
  const canonNote = d.canon && d.canon.bst
    ? `<span class="delta${d.canon.bst < 0 ? " down" : ""}">${signed(d.canon.bst)}</span>
       from ${esc(d.canon_name)} as it really is`
    : `matches ${esc(d.canon_name || "")} as it really is`;
  $("#dexmid").innerHTML = `
    <div style="display:flex; gap:16px; align-items:flex-start">
      <div class="stage">${front ? `<span class="spr"><img src="${sprite(d.folder, front)}" alt=""></span>` : ""}</div>
      <div>
        ${number ? `<span class="dexnum">#${String(number).padStart(3, "0")}</span>` : ""}
        <div class="species-name">${esc(d.name)}
          ${d.delta && d.delta.new ? `<span class="chip place mini">new</span>` : ""}</div>
        <div>${d.types.map(t => typeChip(t)).join("")}
             <span class="sub">${esc(d.category || "")}</span></div>
        <div class="sub" style="margin-top:8px">${canonNote}${
          bstDelta ? `; <span class="delta${bstDelta < 0 ? " down" : ""}">${signed(bstDelta)}</span> from vanilla Platinum` : ""}</div>
        ${d.canon && d.canon.types ? `<div class="sub">typed
          ${d.canon.types.now.join(" / ")} here, ${d.canon.types.was.join(" / ")} really</div>` : ""}
        <div class="sub" style="margin-top:8px; max-width:46ch">${esc(d.entry || "")}</div>
      </div>
    </div>

    <div class="dexsec">
      <h4>base stats &middot; total <span class="num">${d.bst}</span></h4>
      <table class="stats">${statRows(d)}</table>
    </div>

    <div class="dexsec">
      <h4>abilities</h4>
      ${d.abilities.map(a => `<span class="chip plain">${esc(tidy(a))}</span>`).join("")}
      ${d.hidden_ability ? `<span class="chip place">${esc(tidy(d.hidden_ability))} &middot; hidden</span>` : ""}
      ${d.delta && d.delta.abilities
        ? `<div class="sub" style="margin-top:4px">vanilla had
           ${d.delta.abilities.was.map(tidy).join(", ") || "none"}</div>` : ""}
    </div>

    <div class="dexsec">
      <h4>the line</h4>
      <div class="evoline">
        ${(d.line || []).map(m => `
          <span class="ico"><img src="${sprite(m.folder, "icon")}" alt=""></span>
          <a href="#" data-sp="${m.species}" class="${m.species === d.species ? "here" : ""}">${esc(m.label)}</a>
          <span class="sub num">${m.appearances ? m.appearances + " tables" : "not in a table"}</span>
        `).join('<span class="arrow">&rsaquo;</span>')}
      </div>
      ${d.evolutions.length ? `<div class="sub" style="margin-top:6px">
        ${d.evolutions.map(e => `${esc(d.name)} &rarr; ${esc(e.label || "")}
          <span class="sub">(${esc(evoText(e))})</span>`).join("; ")}</div>` : ""}
      ${(d.formes || []).length ? `<div class="sub" style="margin-top:6px">
        formes: ${d.formes.map(e => `<a href="#" data-sp="${e.into}">${esc(e.label || "")}</a>
          <span class="sub">(${esc(evoText(e))}, day or night)</span>`).join("; ")}</div>` : ""}
    </div>

    <div class="dexsec">
      <h4>the rest of it</h4>
      ${facts(d)}
    </div>

    <div class="dexsec">
      <h4>level-up moves</h4>
      <table class="learn">
        <thead><tr><th>Lv</th><th>Move</th><th>Type</th><th>Cat</th>
          <th class="num">Pow</th><th class="num">Acc</th></tr></thead>
        <tbody>${d.learnset.map(m => `<tr>
          <td class="num">${m.level}</td><td>${esc(m.label)}</td>
          <td>${m.type ? typeChip(m.type, "mini") : ""}</td><td class="sub">${tidy(m.class)}</td>
          <td class="num">${m.power || ""}</td><td class="num">${m.accuracy || ""}</td>
        </tr>`).join("")}</tbody>
      </table>
    </div>`;
  $("#dexmid").querySelectorAll("a[data-sp]").forEach(a =>
    a.onclick = ev => { ev.preventDefault(); selectSpecies(a.dataset.sp); });

  const byKind = {};
  (d.captures || []).forEach(c => (byKind[c.kind] = byKind[c.kind] || []).push(c));
  const met = Object.keys(byKind).map(k => `
    <div class="dexsec"><h4>${esc(KINDS[k] || k)}</h4>
      ${byKind[k].map(c => `<div class="met go" data-area="${esc(c.area)}"
           data-kind="${esc(c.kind)}" title="Open this table">
        <b>${esc(c.location || c.area)}</b> ${splitTag(c.split)}<span class="arrow">&rsaquo;</span><br>
        <span class="sub">${c.share ? `<span class="share">${pct(c.share)}</span>` : "one of five slots"} &middot;
          level ${c.level_min}${c.level_max !== c.level_min ? "&ndash;" + c.level_max : ""}</span>
      </div>`).join("")}
    </div>`).join("");

  // Every type, in the games' order, with what it does to this species. The
  // server sends only the multipliers that are not 1, so the rest are 1.
  const cellClass = { 4: "x4", 2: "x2", 1: "x1", 0.5: "x05", 0.25: "x025", 0: "x0" };
  const multLabel = v => v === 0.5 ? "½" : v === 0.25 ? "¼" : String(v);
  const mx = `<div class="mxgrid">${TYPES.map(t => {
    const v = (d.matchups || {})[t] ?? 1;
    return `<div class="mxcell ${cellClass[v] || "x1"}" title="${esc(tidy(t))} does ×${v}">
      ${typeChip(t, "mini")}<span class="m">×${multLabel(v)}</span></div>`;
  }).join("")}</div>`;

  $("#dexright").innerHTML = `
    <h4 style="margin:0 0 8px; font-size:15px; color:var(--dim)">where it is met</h4>
    ${met || `<p class="sub">Not in any table. ${
      (d.line || []).some(m => m.appearances)
        ? "Another stage of its line is, above." : ""}</p>`}
    <div class="dexsec"><h4>damage taken</h4>${mx}</div>`;

  // Where it is met is the one thing this dex knows that a general one cannot,
  // so it opens the table rather than just naming it.
  $("#dexright").querySelectorAll(".met.go").forEach(el =>
    el.onclick = () => openTable(el.dataset.area, el.dataset.kind));
}

function openTable(area, kind) {
  KIND = kind || "land";
  LAYER = "base";
  setView("tables");
  select(area);
}

function setView(view) {
  $("nav#views").querySelectorAll("button").forEach(b =>
    b.classList.toggle("on", b.dataset.view === view));
  $("main:not(#dexmain)").hidden = view !== "tables";
  $("#dexmain").hidden = view !== "dex";
  if (view === "dex" && !POKEDEX.length) {
    api("/api/dex").then(j => { POKEDEX = j.rows; drawDexList(); })
                   .catch(e => toast(e.message, true));
  }
}

// ---- header -------------------------------------------------------------

function drawHeader() {
  const g = GAME.game, t = GAME.thresholds;
  $("#h-ref").textContent = GAME.ref;
  $("#h-n").textContent = g.n_tables;
  // Each metric's tooltip names its threshold. The word in the value ("2 to
  // fix") already says pass or fail, so colour is never the only signal.
  $("#w-spread").title = `Passes at ${t.r8_spread_min}× or more between the most and least varied tables`;
  $("#w-sig").title = `Passes at ${t.r9_signatures_per_table_min} distinct shapes per table or more`;
  $("#w-arc").title = "Passes when concentration falls from early to mid to late";
  $("#w-lint").title = "Lint errors across every table; warnings are not counted";
  $("#h-spread").textContent = g.hhi_spread.toFixed(2) + "×";
  $("#w-spread").className = "metric " + (g.hhi_spread >= t.r8_spread_min ? "pass" : "fail");
  $("#h-sig").textContent = g.signatures_per_table.toFixed(2);
  $("#w-sig").className = "metric " + (g.signatures_per_table >= t.r9_signatures_per_table_min ? "pass" : "fail");
  const arcOk = g.hhi_early > g.hhi_mid && g.hhi_mid > g.hhi_late;
  $("#h-arc").textContent = [g.hhi_early, g.hhi_mid, g.hhi_late]
    .map(x => x == null ? "—" : x.toFixed(2)).join(" → ");
  $("#w-arc").className = "metric " + (arcOk ? "pass" : "fail");
  $("#h-up").textContent = g.best_uplift_median.toFixed(1) + "× on " +
    pct(g.best_uplift_working_frac);
  const errs = GAME.game_findings.filter(f => f.severity === "error").length;
  $("#h-lint").textContent = errs ? errs + " to fix" : "none";
  $("#w-lint").className = "metric " + (errs ? "fail" : "pass");
  $("#h-caught").textContent = CAUGHT.size;
}

// ---- left ---------------------------------------------------------------

function drawList() {
  const q = $("#filter").value.trim().toLowerCase();
  let rows = ALL.slice();
  if (q.startsWith("/")) {
    const sp = q.slice(1);
    rows = rows.filter(r => (r.holds || []).some(s => s.toLowerCase().includes(sp)));
  } else if (q) {
    // The file name too, so "mt coronet" still finds "Mt. Coronet".
    rows = rows.filter(r => r.label.toLowerCase().includes(q)
      || r.area.replace("encounters_", "").replace(/_/g, " ").includes(q));
  }
  // Play order is the game's progression, not the level: grouped by gym
  // split (Post last) and, within a split, in the sidecar's order. An area
  // with no split or order yet sorts after the ones that have them.
  const late = v => v == null ? 1e9 : v;
  if (SORT === "level") rows.sort((a, b) => late(a.split_rank) - late(b.split_rank)
    || late(a.order) - late(b.order) || a.level_med - b.level_med);
  else if (SORT === "area") rows.sort((a, b) => a.label.localeCompare(b.label));
  else if (SORT === "live_total") rows.sort((a, b) => b.live_total - a.live_total);
  else rows.sort((a, b) => b[SORT] - a[SORT]);

  $("#rows").innerHTML = rows.map(r => {
    const flag = r.errors ? "err" : (r.warns ? "wrn" : "");
    const gone = r.species_total - r.live_total;
    const frac = r.species_total ? gone / r.species_total : 0;
    const fade = r.live_total === 0 ? "done"
      : frac >= .66 ? "p3" : frac >= .34 ? "p2" : frac > 0 ? "p1" : "";
    const lv = r.level_min === r.level_max ? r.level_min
      : r.level_min + "–" + r.level_max;
    const water = r.kinds.length > 1 ? `<span class="sub">water</span>` : "";
    return `<div class="arow ${r.area === SEL ? "sel" : ""} ${fade}" data-a="${esc(r.area)}"
        title="${esc(r.live_total ? (r.target_label
          ? "Rarest still missing: " + r.target_label : "") : "Everything here is caught")}">
      <div class="l1"><span class="flag ${flag}"></span>${esc(r.label)}</div>
      <div class="l2">${splitTag(r.split)}${water}${r.no_capture ? `<span class="sub">no capture</span>` : ""}</div>
      <div class="enc ${r.encounter_label ? "" : "none"}" title="${esc(r.encounter_label ? "Caught here: " + r.encounter_label : "Nothing caught here yet")}">${
        r.encounter ? icon(r.encounter) : ""}<span class="lbl">${esc(r.encounter_label || "\u2014")}</span></div>
      <div class="num">${lv}</div>
      <div class="num">${r.live_total}/${r.species_total}</div>
      <div class="num">${r.live_total ? pct(r.best_share) : "—"}</div>
    </div>`;
  }).join("") || `<p class="sub" style="padding:12px">Nothing matches that.</p>`;
  document.querySelectorAll("#rows .arow").forEach(el =>
    el.onclick = () => select(el.dataset.a));
}

// ---- combobox -----------------------------------------------------------

function combobox(label, onPick) {
  const wrap = document.createElement("span");
  wrap.className = "cb";
  wrap.innerHTML = `<input value="${esc(label)}" aria-label="Species">
                    <span class="caret">▼</span><div class="menu"></div>`;
  const input = wrap.querySelector("input"), menu = wrap.querySelector(".menu");
  let idx = -1, items = [];

  function render(filter) {
    const f = (filter || "").toLowerCase();
    items = f ? DEX.filter(d => d.label.toLowerCase().includes(f)) : DEX.slice();
    menu.innerHTML = items.slice(0, 400).map((d, i) =>
      `<div data-i="${i}" class="${i === idx ? "on" : ""}">${esc(d.label)}</div>`).join("")
      || `<div class="sub" style="padding:3px 9px">No species by that name</div>`;
    menu.querySelectorAll("div[data-i]").forEach(el =>
      el.onmousedown = ev => { ev.preventDefault(); pick(items[+el.dataset.i]); });
  }
  function open(filter) {
    idx = -1; render(filter);
    const r = input.getBoundingClientRect();
    menu.style.left = r.left + "px";
    menu.style.top = (r.bottom + 2) + "px";
    menu.style.minWidth = r.width + "px";
    wrap.classList.add("open");
  }
  const close = () => wrap.classList.remove("open");
  function pick(d) { if (!d) return; input.value = d.label; close(); onPick(d.value); }

  wrap.querySelector(".caret").onmousedown = ev => {
    ev.preventDefault();
    wrap.classList.contains("open") ? close() : (input.focus(), open(""));
  };
  input.onfocus = () => open(input.value === label ? "" : input.value);
  input.oninput = () => open(input.value);
  input.onkeydown = ev => {
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      if (!wrap.classList.contains("open")) return open(input.value);
      idx = Math.max(0, Math.min(items.length - 1, idx + (ev.key === "ArrowDown" ? 1 : -1)));
      render(input.value);
      const on = menu.querySelector(".on");
      if (on) on.scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter") {
      ev.preventDefault();
      pick(idx >= 0 ? items[idx]
        : items.find(d => d.label.toLowerCase() === input.value.toLowerCase()));
    } else if (ev.key === "Escape") { close(); input.value = label; }
  };
  input.onblur = () => setTimeout(() => {
    close();
    const hit = BY_LABEL.get(input.value.trim().toLowerCase());
    if (!hit) { input.value = label; return; }
    if (hit !== BY_LABEL.get(label.toLowerCase())) onPick(hit);
  }, 120);
  return wrap;
}

// ---- centre -------------------------------------------------------------

function drawMid() {
  const d = DETAIL;
  if (!d) return;
  if (d.empty) {
    $("#mid").innerHTML = `<p class="sub">${esc(d.label)} has no ${esc(KIND)} table.</p>`;
    return;
  }
  const dayL = d.day_labels || [], nightL = d.night_labels || [];
  const layerVals = LAYER === "day" ? dayL : LAYER === "night" ? nightL : null;
  const ranged = d.ranged;

  const kindBar = d.kinds.map(k =>
    `<button data-kind="${k}" class="${k === d.kind ? "on" : ""}">${esc(d.kind_labels[k])}</button>`).join("");

  const timeBar = d.kind === "land" ? `<span class="kgap"></span>
      ${["base", "day", "night"].map(l => `<button data-layer="${l}" class="${LAYER === l ? "on" : ""}"
        ${l !== "base" && !(l === "day" ? dayL.length : nightL.length) ? "disabled" : ""}
        >${l === "base" ? "Morning" : l === "day" ? "Day" : "Night"}</button>`).join("")}
    ${LAYER !== "base" ? `<span class="sub">
      ${LAYER === "day" ? "Day" : "Night"} swaps slots 2 and 3 only, so at most 20% of the table changes.</span>` : ""}` : "";

  // The area's water tables in brief, under the tables being edited, so all
  // of an area can be read at once. A panel is a view: clicking it opens that
  // table above for editing, as its tab does.
  const water = (d.water || []).map(w => `
    <div class="wpanel ${w.kind === d.kind ? "on" : ""}" data-kind="${w.kind}"
         title="${w.kind === d.kind ? "Being edited above" : "Open " + esc(w.label) + " for editing"}">
      <div class="wtitle"><span>${esc(w.label)}</span><span class="sub">rate <span class="num">${w.rate}</span></span></div>
      ${w.slots.map(sl => `<div class="wrow ${sl.caught || sl.duped ? "gone" : ""}"
          title="${esc(sl.label)}: ${sl.caught || sl.duped ? "already caught" : pct(sl.odds) + " real odds"}">
        <span class="num rate">${sl.rate}%</span>${icon(sl.species)}
        <span class="spname">${esc(sl.label)}</span>
        <span class="num lv">${sl.level_min === sl.level_max ? sl.level_min : sl.level_min + "\u2013" + sl.level_max}</span>
      </div>`).join("")}
    </div>`).join("");

  // Remember each odds bar's width before the pane is rebuilt, as the ladder
  // on the right does, so ticking a catch eases the bars to their new
  // lengths instead of jumping; switching between morning, day and night
  // eases them too. The key names the area and table, so moving elsewhere
  // never animates from another table's bars.
  const before = new Map();
  document.querySelectorAll("#mid .meets .bar span[data-k]").forEach(el =>
    before.set(el.dataset.k, el.style.width));
  const barKey = sp => [SEL, d.kind, sp].join("/");

  // Day and night have their own list, with slots 2 and 3 swapped in.
  const merged = (LAYER !== "base" && (d.merged_layers || {})[LAYER]) || d.merged;
  const mergedRows = merged.map(m => {
    const w = m.caught || m.duped ? 0 : Math.max(1.5, m.cond * 100);
    return `<div class="meet ${m.caught || m.duped ? "gone" : ""}">
      ${icon(m.species)}<span class="nm"><span class="spname">${esc(m.label)}</span>${m.duped
        ? ` <span class="tag">${esc((m.via ? m.via + ", " : "") + m.caught_at)}</span>` : ""}</span>
      <span class="num">${m.caught || m.duped ? "0%" : pct(m.cond)}</span>
      <span class="num paper">${pct(m.share)}</span>
      <div class="bar" style="height:9px">
        <span data-k="${esc(barKey(m.species))}" style="width:${w}%;background:var(--mass)"></span>
      </div></div>`;
  }).join("");

  $("#mid").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:12px">
      <div><span class="aname">${esc(d.label)}</span>
        <span class="tag">${esc(d.band || "—")}</span>
        <span class="tag">${esc(d.archetype || "no archetype yet")}</span>
        ${d.location ? `<span class="tag" title="Capture area: one catch per location name">${esc(d.location)}</span>` : ""}
        ${d.split ? `<span title="Gym split">${splitTag(d.split, " split")}</span>` : ""}
        ${d.no_capture ? `<span class="tag" title="The starter's area: nothing is catchable here">no capture</span>` : ""}</div>
      <div class="encounter"><span class="k">Encounter</span>
        <span class="v ${d.encounter_label ? "" : "none"}">${d.encounter ? icon(d.encounter) : ""}${esc(d.encounter_label || "none yet")}</span>
        <span class="sub">rate <span class="num">${d.rate}</span></span></div>
    </div>
    ${d.intent ? `<p class="sub" style="margin:2px 0 0">${esc(d.intent)}</p>` : ""}
    <div class="kinds">${kindBar}${timeBar}</div>
    <div class="tables">
    <table class="grid slots"><thead><tr>
      <th class="num">#</th><th class="num">Rate</th><th>Species</th>
      <th class="num">${ranged ? "Levels" : "Level"}</th>
      <th title="Tick what you have caught. Every table updates.">Caught</th>
    </tr></thead><tbody id="slotrows"></tbody></table>

    <div class="meets">
    <div class="meet head" title="What a player meets: each species' chance, counting only what you still need, against its share on paper"><span></span><span>Species</span>
      <span class="num">Real odds</span><span class="num">On paper</span></div>
    ${mergedRows}</div></div>
    ${water ? `<div class="water">${water}</div>` : ""}`;

  const tb = $("#slotrows");
  d.slots.forEach(s => {
    const substituted = layerVals && (s.slot === 2 || s.slot === 3);
    const shown = substituted ? layerVals[s.slot - 2] : s.label;
    const locked = LAYER !== "base" && !substituted;
    const gone = s.caught || s.duped;
    const tr = document.createElement("tr");
    if (gone) tr.className = "gone";
    tr.innerHTML = `<td class="num">${s.slot}</td><td class="num rate">${s.rate}%</td>
      <td class="spname"></td>
      <td class="num">${ranged
        ? `<input class="lv num" type="number" min="1" max="100" value="${s.level_min}" data-f="level_min">
           <input class="lv num" type="number" min="1" max="100" value="${s.level_max}" data-f="level_max">`
        : `<input class="lv num" type="number" min="1" max="100" value="${s.level_min}" data-f="level"
             ${LAYER !== "base" ? "disabled" : ""}>`}</td>
      <td><input type="checkbox" class="ck" ${s.caught ? "checked" : ""}
           ${s.duped ? `disabled title="${esc((s.via ? s.via + " was " : "") + "caught on " + s.caught_at)}"` : ""}></td>`;
    const cell = tr.querySelector(".spname");
    // The icon follows what the slot holds now, including a day or night
    // substitution, which is the species the combobox is showing.
    const held = substituted ? (BY_LABEL.get(String(shown).toLowerCase()) || s.species)
                             : s.species;
    cell.innerHTML = icon(held);
    if (locked) cell.insertAdjacentHTML("beforeend", `<span class="sub">${esc(shown)}</span>`);
    else cell.appendChild(combobox(shown, val => {
      if (d.kind !== "land") write("slot", { kind: d.kind, slot: s.slot, species: val });
      else if (LAYER === "base") write("slot", { slot: s.slot, species: val });
      else write("time", { layer: LAYER, index: s.slot - 2, species: val });
    }));
    tr.querySelectorAll("input.lv").forEach(inp => inp.onchange = () => {
      const body = { kind: d.kind, slot: s.slot };
      body[inp.dataset.f] = +inp.value;
      write("slot", body);
    });
    tr.querySelector("input.ck").onchange = ev => setCaught(SEL, s.species, ev.target.checked);
    tb.appendChild(tr);
  });

  if (before.size && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const bars = [...document.querySelectorAll("#mid .meets .bar span[data-k]")]
      .filter(el => before.has(el.dataset.k));
    const target = bars.map(el => el.style.width);
    bars.forEach(el => { el.style.width = before.get(el.dataset.k); });
    void document.body.offsetWidth;          // lay the old widths out first
    bars.forEach((el, i) => { el.style.width = target[i]; });
  }

  document.querySelectorAll("#mid .kinds button[data-kind], #mid .wpanel").forEach(b =>
    b.onclick = () => { KIND = b.dataset.kind; LAYER = "base"; select(SEL); });
  document.querySelectorAll("#mid .kinds button[data-layer]").forEach(b =>
    b.onclick = () => { LAYER = b.dataset.layer; drawMid(); });
}

// ---- right --------------------------------------------------------------

// The ladder's segments cycle through five fills, teal and pink alternating,
// all of them tokens. The text on a segment has to be worked out per segment,
// and it is whichever of --ink and --on-mass contrasts more with that fill,
// read back from the page because the fills differ between themes. The design
// suggested a 0.33 luminance threshold instead, but that picks light text on
// the dark theme's third segment at 3.2 to 1, under AA for 11px labels; the
// higher-contrast choice agrees with it everywhere else and gives 4.8 there.
// The answer is cached until the theme moves.
const SEGMENTS = 5;
let SEG_TEXT = null;

function resolvedRGB(token) {
  const probe = document.createElement("span");
  probe.style.color = `var(${token})`;
  document.body.appendChild(probe);
  const rgb = (getComputedStyle(probe).color.match(/[\d.]+/g) || [0, 0, 0])
    .slice(0, 3).map(Number);
  probe.remove();
  return rgb;
}

// WCAG relative luminance, the same measure the palette preview used.
function luminance([r, g, b]) {
  const lin = v => (v /= 255) <= .03928 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4);
  return .2126 * lin(r) + .7152 * lin(g) + .0722 * lin(b);
}

// WCAG contrast ratio between two relative luminances.
const contrast = (a, b) => (Math.max(a, b) + .05) / (Math.min(a, b) + .05);

function segText(i) {
  if (!SEG_TEXT) {
    const ink = luminance(resolvedRGB("--ink")), onMass = luminance(resolvedRGB("--on-mass"));
    SEG_TEXT = [];
    for (let n = 1; n <= SEGMENTS; n++) {
      const fill = luminance(resolvedRGB(`--seg-${n}`));
      SEG_TEXT.push(contrast(ink, fill) >= contrast(onMass, fill) ? "var(--ink)" : "var(--on-mass)");
    }
  }
  return SEG_TEXT[i % SEGMENTS];
}

// A theme change repaints the fills, so the text choices go stale with them.
if (window.oxideTheme) oxideTheme.onChange(() => { SEG_TEXT = null; if (DETAIL) drawRight(); });

function drawRight() {
  const d = DETAIL;
  if (!d || d.empty) { $("#right").innerHTML = ""; return; }
  // Remember every ladder segment's width before the pane is rebuilt, so the
  // same segments can start from where they were and ease to where they are
  // now. Keys carry the area and table kind, so moving to another area never
  // animates from a different table's shapes.
  const before = new Map();
  document.querySelectorAll("#right .bar span[data-k]").forEach(el =>
    before.set(el.dataset.k, el.style.width));
  const m = d.metrics, c = d.caught_metrics, t = GAME.thresholds;
  const payThreshold = t.r3_uplift_min;
  const best = m.uplift_at_level;

  const rungs = d.rungs.map(r => {
    const segs = r.pool.map((p, i) => {
      const gone = p.caught || p.duped;
      const w = (gone ? p.share : p.share) * 100;
      return `<span class="${gone ? "gone" : ""}" data-k="${esc(d.area + "|" + d.kind + "|" + r.level + "|" + p.species)}" style="width:${w}%;
        ${gone ? "" : `background:var(--seg-${(i % SEGMENTS) + 1});color:${segText(i)}`}"
        title="${esc(p.label)} ${pct(p.share)}${gone ? " — already caught" : ""}">${
        w > 11 ? (gone ? "" : pct(p.cond)) : ""}</span>`;
    }).join("");
    const legend = r.pool.map(p => p.caught || p.duped
      ? `<s>${esc(p.label)}</s>` : `${esc(p.label)} ${pct(p.cond)}`).join("");
    return `<div class="rung">
      <div class="cap"><span class="lead ${r.level === best ? "best" : ""}">Lead level ${r.level}</span>
        <span>${isFinite(r.throughput)
          ? r.throughput.toFixed(1) + " encounters per one that counts"
          : "nothing left here"}</span></div>
      <div class="bar">${segs}</div>
      <div class="legend">${legend}</div></div>`;
  }).join("");

  const findings = d.findings.length
    ? d.findings.map(f => `<div class="finding ${f.severity}">
        <span class="rule">${f.rule}</span>${esc(f.message)}
        ${["R3","R5","R11b","R13"].includes(f.rule)
          ? '<span class="asp">— a target beyond vanilla</span>' : ""}</div>`).join("")
    : `<p class="sub">No problems on this table.</p>`;

  $("#right").innerHTML = `
    <h2>Is a repel worth it here</h2>
    <div class="headline ${m.uplift_on_rarest >= payThreshold ? "good" : "bad"}">
      ${m.uplift_on_rarest.toFixed(2)}×</div>
    <p class="sub">Best improvement on ${esc(d.rarest_label || "—")}, the rarest species
      ${m.uplift_at_level ? `, with a level ${m.uplift_at_level} lead` : " — no repel helps it"}.
      Aiming for ${payThreshold}× or better.</p>
    <p class="sub">The biggest swing on this table is
      <b>${m.best_uplift.toFixed(2)}×</b> on ${esc(d.best_uplift_label || "—")}.</p>

    <h2>What you still need here</h2>
    ${c.live_species === 0
      ? `<p class="sub">Everything on this table is caught.</p>`
      : `<p class="sub"><b>${c.live_species}</b> of ${m.n_species} species left.
        The rarest of them reaches <b>${pct(c.best_share)}</b>${
        c.best_level ? ` with a level ${c.best_level} lead` : " at plain odds"}.</p>`}

    <h2>The repel ladder</h2>
    <p class="sub" style="margin:-3px 0 9px">Each bar is what survives a repel at that
      lead level, drawn to scale. Hatched species are already caught, so their share
      goes to the rest.</p>
    ${rungs || `<p class="sub">This table has a single rung.</p>`}

    <h2>How to make my catch here a particular species</h2>
    <div class="plan">
      <div class="pick">
        <select id="plan-sp" aria-label="Species to plan for">
          ${d.merged.filter(x => !x.caught && !x.duped).map(x =>
            `<option value="${esc(x.species)}" ${x.species === PLAN_SP ? "selected" : ""}>${esc(x.label)} (${pct(x.cond)})</option>`).join("")}
        </select>
        <button id="plan-go">Plan</button>
      </div>
      <div id="plan-out">${PLAN && PLAN.target === d.area && PLAN.kind === d.kind
        ? renderPlan(PLAN) : `<p class="sub" style="margin:6px 0 0">Picks what to catch on earlier routes so that, when you get here, your one counting encounter is the species you want.</p>`}</div>
    </div>

    <h2>Shape</h2>
    <p class="sub">${m.n_species} species, the commonest at ${pct(m.top_share)},
      concentration ${m.hhi.toFixed(3)}, ${m.rung_count} rungs of
      ${m.pool_sizes.join(", ")} species.
      ${m.has_real_tail ? "The rare slots hold something found nowhere else on the table."
                        : "The rare slots repeat species from the top."}</p>

    <h2>Problems</h2>
    ${findings}`;

  if (before.size && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const segs = [...document.querySelectorAll("#right .bar span[data-k]")]
      .filter(el => before.has(el.dataset.k));
    const target = segs.map(el => el.style.width);
    segs.forEach(el => { el.style.width = before.get(el.dataset.k); });
    void document.body.offsetWidth;          // lay the old widths out first
    segs.forEach((el, i) => { el.style.width = target[i]; });
  }

  const go = $("#plan-go"), sel = $("#plan-sp");
  if (go && sel) {
    sel.onchange = () => { PLAN_SP = sel.value; };
    go.onclick = async () => {
      PLAN_SP = sel.value;
      go.disabled = true; go.textContent = "Planning…";
      try {
        PLAN = await api(`/api/plan?area=${SEL}&species=${PLAN_SP}&kind=${KIND}`);
        $("#plan-out").innerHTML = renderPlan(PLAN);
      } catch (e) { toast(e.message, true); }
      go.disabled = false; go.textContent = "Plan";
    };
  }
}

function renderPlan(pl) {
  if (!pl.front.length) return `<p class="sub">No way to reach it from here.</p>`;
  const items = pl.lines.map((s, i) => {
    const c = pl.front[i];
    return `<li>${esc(s).replace(/(\d+)%/g, "<b>$1%</b>")}</li>`;
  }).join("");
  return `<p class="sub" style="margin:6px 0 0">${pl.n_candidates} plans considered; the ones below each raise the odds for their cost.</p><ol>${items}</ol>`;
}

// ---- actions ------------------------------------------------------------

async function setCaught(area, species, caught) {
  try {
    const r = await api("/api/caught", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ area, species, caught }) });
    CAUGHT = new Set(r.caught);
    toast(caught ? "Caught here" : "Cleared this area's encounter");
    await Promise.all([reloadDetail(), refreshList()]);
  } catch (e) { toast(e.message, true); }
}

async function clearCaught() {
  try {
    const r = await api("/api/caught", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ clear: true }) });
    CAUGHT = new Set(r.caught);
    toast("Caught list reset");
    await Promise.all([reloadDetail(), refreshList()]);
  } catch (e) { toast(e.message, true); }
}

async function write(kind, body) {
  try {
    DETAIL = await api(`/api/area/${SEL}/${kind}`, { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ kind: KIND }, body)) });
    toast(DETAIL.changed ? "Saved" : "No change");
    drawMid(); drawRight();
    await refreshList();
  } catch (e) { toast(e.message, true); select(SEL); }
}

async function reloadDetail() {
  if (!SEL) return;
  DETAIL = await api(`/api/area/${SEL}?kind=${KIND}`);
  drawMid(); drawRight();
}

async function select(name) {
  if (name !== SEL) { PLAN = null; PLAN_SP = null; }
  SEL = name;
  try {
    DETAIL = await api(`/api/area/${name}?kind=${KIND}`);
    if (DETAIL.empty && DETAIL.kinds && DETAIL.kinds.length) {
      KIND = DETAIL.kinds[0];
      DETAIL = await api(`/api/area/${name}?kind=${KIND}`);
    }
    drawMid(); drawRight(); drawList();
  } catch (e) { toast(e.message, true); }
}

async function refreshList() {
  GAME = await api("/api/areas");
  ALL = GAME.rows;
  drawHeader(); drawList();
}

async function boot() {
  try {
    const [areas, dexRows, caught] = await Promise.all([
      api("/api/areas"), api("/api/species"), api("/api/caught")]);
    GAME = areas; ALL = areas.rows; DEX = dexRows.species;
    KINDS = areas.kind_labels || KINDS;
    if (areas.root) $("#h-root").textContent = areas.root.split("/").pop();
    BY_LABEL = new Map(DEX.map(d => [d.label.toLowerCase(), d.value]));
    CAUGHT = new Set(caught.caught);
    drawHeader(); drawList();
    // Every species a table holds is on the pick-list, which the leak audit
    // guarantees, so the tables are where the empty column's icon comes from.
    const held = [...new Set(ALL.flatMap(r => r.holds || []))];
    const pickFrom = held.map(l => BY_LABEL.get(l.toLowerCase())).filter(Boolean);
    if (pickFrom.length && $("#empty-icon"))
      $("#empty-icon").innerHTML = icon(pickFrom[Math.floor(Math.random() * pickFrom.length)]);
  } catch (e) {
    $("#rows").innerHTML = `<p class="sub" style="padding:12px">${esc(e.message)}</p>`;
  }
}

$("#filter").oninput = drawList;
$("#dexfilter").oninput = drawDexList;
document.querySelectorAll("nav#views button").forEach(b =>
  b.onclick = () => setView(b.dataset.view));
document.querySelectorAll("#dexlist .sortbar button").forEach(b => b.onclick = () => {
  DEXFILTER = b.dataset.f;
  document.querySelectorAll("#dexlist .sortbar button")
          .forEach(x => x.classList.toggle("on", x === b));
  drawDexList();
});
document.querySelectorAll("#list .sortbar button").forEach(b => b.onclick = () => {
  SORT = b.dataset.k;
  document.querySelectorAll("#list .sortbar button")
          .forEach(x => x.classList.toggle("on", x === b));
  drawList();
});
$("#clear-caught").onclick = clearCaught;
boot();
</script>
