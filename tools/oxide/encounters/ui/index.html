<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Encounter Tool</title>
<style>
:root {
  --bg: #14161a; --panel: #1b1e24; --line: #2b303a; --ink: #e6e8ec;
  --dim: #8b93a1; --accent: #7aa2f7; --good: #7fd88f; --warn: #e0af68;
  --bad: #f7768e; --chip: #232833;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
header {
  padding: 8px 14px; border-bottom: 1px solid var(--line);
  display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap;
  position: sticky; top: 0; background: var(--bg); z-index: 20;
}
header h1 { font-size: 13px; margin: 0 12px 0 0; font-weight: 700; }
.stat { color: var(--dim); white-space: nowrap; }
.stat b { color: var(--ink); font-weight: 600; }
.stat.bad b { color: var(--bad); }
.stat.good b { color: var(--good); }
main { display: grid; grid-template-columns: 320px minmax(460px,1fr) 400px;
       gap: 0; height: calc(100vh - 42px); }
section { overflow-y: auto; padding: 0 12px 10px; }
#list { border-right: 1px solid var(--line); }
#right { border-left: 1px solid var(--line); }
/* the filter stays put however far the area list is scrolled */
#listhead {
  position: sticky; top: 0; z-index: 10; background: var(--bg);
  padding: 10px 0 6px; border-bottom: 1px solid var(--line);
  margin-bottom: 6px;
}
#mid, #right { padding-top: 10px; }
h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
     color: var(--dim); margin: 16px 0 6px; font-weight: 600; }
h2:first-child { margin-top: 0; }
input, select, button {
  font: inherit; background: var(--chip); color: var(--ink);
  border: 1px solid var(--line); border-radius: 3px; padding: 2px 5px;
}
input:focus, select:focus { outline: 1px solid var(--accent); }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
#filter { width: 100%; }
.row {
  display: grid; grid-template-columns: 1fr auto; gap: 6px; padding: 4px 6px;
  border-radius: 3px; cursor: pointer; align-items: center;
}
.row:hover { background: var(--panel); }
.row.sel { background: var(--chip); outline: 1px solid var(--accent); }
.row.done .nm { color: var(--dim); }
.row .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .meta { color: var(--dim); font-size: 11px; white-space: nowrap; }
.dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%;
       margin-right: 5px; vertical-align: middle; }
.dot.err { background: var(--bad); }
.dot.wrn { background: var(--warn); }
.dot.ok  { background: #34404f; }
table { border-collapse: collapse; width: 100%; }
th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11px;
     padding: 2px 6px; text-transform: uppercase; letter-spacing: .05em; }
td { padding: 1px 6px; border-top: 1px solid var(--line); }
td.num { text-align: right; color: var(--dim); }
tr.caught td { color: var(--dim); }
input.lv { width: 52px; text-align: right; }
.bar { height: 7px; background: var(--chip); border-radius: 2px;
       overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; }
.tabs { display: flex; gap: 4px; margin-bottom: 8px; }
.tabs button.on { background: var(--accent); color: #0d1017; border-color: var(--accent); }
.note { color: var(--dim); }
.finding { padding: 3px 0; border-top: 1px solid var(--line); }
.finding .rule { color: var(--accent); }
.finding.error .rule { color: var(--bad); }
.finding .asp { color: var(--dim); }
.rung { margin: 7px 0; }
.rung .hd { color: var(--dim); margin-bottom: 2px; }
.pill { display: inline-block; padding: 0 5px; border-radius: 9px;
        background: var(--chip); color: var(--dim); font-size: 11px; }
#toast { position: fixed; right: 14px; bottom: 12px; background: var(--panel);
         border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px;
         opacity: 0; transition: opacity .15s; pointer-events: none; z-index: 60; }
#toast.on { opacity: 1; }
#toast.err { border-color: var(--bad); color: var(--bad); }
.big { font-size: 20px; font-weight: 700; }
.big.good { color: var(--good); } .big.bad { color: var(--bad); }
/* combobox: type to filter, or click the caret to browse the whole dex */
.cb { position: relative; }
.cb input { width: 100%; padding-right: 18px; }
.cb .caret { position: absolute; right: 4px; top: 2px; color: var(--dim);
             cursor: pointer; font-size: 10px; user-select: none; }
.cb .menu {
  display: none; position: fixed; z-index: 50; background: var(--panel);
  border: 1px solid var(--accent); border-radius: 3px; max-height: 260px;
  overflow-y: auto; min-width: 190px; box-shadow: 0 6px 18px #0009;
}
.cb.open .menu { display: block; }
.cb .menu div { padding: 2px 8px; cursor: pointer; white-space: nowrap; }
.cb .menu div.on, .cb .menu div:hover { background: var(--chip); color: var(--accent); }
.ck { cursor: pointer; vertical-align: middle; }
</style>
</head>
<body>
<header>
  <h1>Encounter Tool</h1>
  <span class="stat">ref <b id="h-ref">-</b></span>
  <span class="stat">tables <b id="h-n">-</b></span>
  <span class="stat" id="h-spread-w">spread <b id="h-spread">-</b></span>
  <span class="stat" id="h-sig-w">sig/table <b id="h-sig">-</b></span>
  <span class="stat">HHI <b id="h-hhi">-</b></span>
  <span class="stat" id="h-arc-w">arc <b id="h-arc">-</b></span>
  <span class="stat">repel <b id="h-up">-</b></span>
  <span class="stat" id="h-lint-w">lint <b id="h-lint">-</b></span>
  <span class="stat">caught <b id="h-caught">0</b>
    <a href="#" id="clear-caught" style="color:var(--dim)">clear</a></span>
</header>
<main>
  <section id="list">
    <div id="listhead">
      <input id="filter" placeholder="filter areas — or /gible for tables holding it">
      <div id="sort" class="note" style="margin-top:5px">
        sort:
        <a href="#" data-k="level">play order</a> ·
        <a href="#" data-k="area">name</a> ·
        <a href="#" data-k="hhi">hhi</a> ·
        <a href="#" data-k="species">species</a> ·
        <a href="#" data-k="uplift">uplift</a> ·
        <a href="#" data-k="warns">lint</a>
      </div>
    </div>
    <div id="rows"></div>
  </section>

  <section id="mid">
    <div id="mid-body" class="note">pick an area on the left</div>
  </section>

  <section id="right">
    <div id="right-body" class="note">&nbsp;</div>
  </section>
</main>
<div id="toast"></div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
const pct = v => (v * 100).toFixed(v * 100 < 10 ? 1 : 0) + "%";

let ALL = [], GAME = null, DEX = [], BY_LABEL = new Map();
let SEL = null, DETAIL = null, CAUGHT = new Set();
let SORT = "level", LAYER = "base";

function toast(msg, bad) {
  const t = $("#toast");
  t.textContent = msg;
  t.className = "on" + (bad ? " err" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (t.className = ""), bad ? 5000 : 1600);
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ error: "bad response" }));
  if (!r.ok || j.error) throw new Error(j.error || r.statusText);
  return j;
}

// ---- header -------------------------------------------------------------

function drawHeader() {
  const g = GAME.game, t = GAME.thresholds;
  $("#h-ref").textContent = GAME.ref;
  $("#h-n").textContent = g.n_tables;
  const spread = g.hhi_spread, sig = g.signatures_per_table;
  $("#h-spread").textContent = spread.toFixed(2) + "x";
  $("#h-spread-w").className = "stat " + (spread >= t.r8_spread_min ? "good" : "bad");
  $("#h-sig").textContent = sig.toFixed(2);
  $("#h-sig-w").className = "stat " + (sig >= t.r9_signatures_per_table_min ? "good" : "bad");
  $("#h-hhi").textContent = g.hhi_median.toFixed(3);
  const arcOk = g.hhi_early > g.hhi_mid && g.hhi_mid > g.hhi_late;
  $("#h-arc").textContent =
    [g.hhi_early, g.hhi_mid, g.hhi_late].map(x => x == null ? "-" : x.toFixed(2)).join(" > ");
  $("#h-arc-w").className = "stat " + (arcOk ? "good" : "bad");
  $("#h-up").textContent = g.best_uplift_median.toFixed(1) + "x / " +
    pct(g.best_uplift_working_frac);
  const errs = GAME.game_findings.filter(f => f.severity === "error").length;
  const wrns = GAME.game_findings.filter(f => f.severity === "warn").length;
  $("#h-lint").textContent = errs + "e " + wrns + "w";
  $("#h-lint-w").className = "stat " + (errs ? "bad" : "good");
  $("#h-caught").textContent = CAUGHT.size;
}

// ---- left ---------------------------------------------------------------

function drawList() {
  const q = $("#filter").value.trim().toLowerCase();
  let rows = ALL.slice();
  if (q.startsWith("/")) {
    const sp = q.slice(1);
    rows = rows.filter(r => (r.holds || []).some(s => s.toLowerCase().includes(sp)));
  } else if (q) {
    rows = rows.filter(r => r.area.toLowerCase().includes(q));
  }
  if (SORT === "level") rows.sort((a, b) => a.level_med - b.level_med || a.level_min - b.level_min);
  else if (SORT === "area") rows.sort((a, b) => a.area.localeCompare(b.area));
  else rows.sort((a, b) => b[SORT] - a[SORT]);

  $("#rows").innerHTML = rows.map(r => {
    const cls = r.errors ? "err" : (r.warns ? "wrn" : "ok");
    const done = r.live_species === 0;
    const right = done
      ? "all caught"
      : `lv${r.level_min}${r.level_max !== r.level_min ? "-" + r.level_max : ""}`
        + ` · ${r.live_species} left · ${pct(r.best_share)}`;
    return `<div class="row ${r.area === SEL ? "sel" : ""} ${done ? "done" : ""}"
      data-a="${esc(r.area)}" title="${esc(r.target_label
        ? "rarest still missing: " + r.target_label + (r.best_level ? " — best at lead level " + r.best_level : "")
        : "nothing left to catch here")}">
      <div class="nm"><span class="dot ${cls}"></span>${esc(r.area.replace(/^encounters_/, ""))}</div>
      <div class="meta">${right}</div>
    </div>`;
  }).join("") || `<div class="note">nothing matches</div>`;
  document.querySelectorAll("#rows .row").forEach(el =>
    el.onclick = () => select(el.dataset.a));
}

// ---- combobox -----------------------------------------------------------

function combobox(value, onPick) {
  const wrap = document.createElement("span");
  wrap.className = "cb";
  wrap.innerHTML = `<input value="${esc(value)}"><span class="caret">▼</span>
                    <div class="menu"></div>`;
  const input = wrap.querySelector("input");
  const menu = wrap.querySelector(".menu");
  let idx = -1, items = [];

  function render(filter) {
    const f = (filter || "").toLowerCase();
    items = f ? DEX.filter(d => d.label.toLowerCase().includes(f)) : DEX.slice();
    menu.innerHTML = items.slice(0, 400).map((d, i) =>
      `<div data-i="${i}" class="${i === idx ? "on" : ""}">${esc(d.label)}</div>`).join("")
      || `<div class="note" style="padding:2px 8px">no match</div>`;
    menu.querySelectorAll("div[data-i]").forEach(el => {
      el.onmousedown = ev => { ev.preventDefault(); pick(items[+el.dataset.i]); };
    });
  }
  function open(filter) {
    idx = -1; render(filter);
    const r = input.getBoundingClientRect();
    menu.style.left = r.left + "px";
    menu.style.top = (r.bottom + 2) + "px";
    menu.style.minWidth = r.width + "px";
    wrap.classList.add("open");
  }
  function close() { wrap.classList.remove("open"); }
  function pick(d) {
    if (!d) return;
    input.value = d.label;
    close();
    onPick(d.value);
  }

  wrap.querySelector(".caret").onmousedown = ev => {
    ev.preventDefault();
    wrap.classList.contains("open") ? close() : (input.focus(), open(""));
  };
  input.onfocus = () => open(input.value === value ? "" : input.value);
  input.oninput = () => open(input.value);
  input.onkeydown = ev => {
    if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
      ev.preventDefault();
      if (!wrap.classList.contains("open")) return open(input.value);
      idx = Math.max(0, Math.min(items.length - 1, idx + (ev.key === "ArrowDown" ? 1 : -1)));
      render(input.value);
      const on = menu.querySelector(".on");
      if (on) on.scrollIntoView({ block: "nearest" });
    } else if (ev.key === "Enter") {
      ev.preventDefault();
      pick(idx >= 0 ? items[idx] : items.find(d => d.label.toLowerCase() === input.value.toLowerCase()));
    } else if (ev.key === "Escape") { close(); input.value = value; }
  };
  input.onblur = () => {
    setTimeout(() => {
      close();
      const hit = BY_LABEL.get(input.value.trim().toLowerCase());
      if (!hit) { input.value = value; return; }   // never leave an unsaved name on screen
      if (hit !== BY_LABEL.get(value.toLowerCase())) onPick(hit);
    }, 120);
  };
  return wrap;
}

// ---- centre -------------------------------------------------------------

function drawMid() {
  const d = DETAIL;
  if (!d) return;
  const dayL = d.day_labels || [], nightL = d.night_labels || [];
  const layerVals = LAYER === "day" ? dayL : LAYER === "night" ? nightL : null;

  const merged = d.merged.map(m => {
    const w = Math.max(2, m.share * 100);
    return `<tr class="${m.caught ? "caught" : ""}"><td>${esc(m.label)}</td>
      <td class="num">${pct(m.share)}</td>
      <td style="width:45%"><div class="bar"><i style="width:${w}%;background:${
        m.caught ? "#3a4450" : "var(--accent)"}"></i></div></td></tr>`;
  }).join("");

  $("#mid-body").innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
      <div><b>${esc(d.area.replace(/^encounters_/, ""))}</b>
        <span class="pill">${esc(d.band || "-")}</span>
        <span class="pill">${esc(d.archetype || "no archetype")}</span></div>
      <div class="note">land_rate <input class="lv" id="rate" type="number"
        min="0" max="100" value="${d.land_rate}"></div>
    </div>
    ${d.intent ? `<div class="note" style="margin-top:4px">${esc(d.intent)}</div>` : ""}

    <div class="tabs" style="margin-top:10px">
      ${["base", "day", "night"].map(l =>
        `<button data-layer="${l}" class="${LAYER === l ? "on" : ""}"
          ${l !== "base" && !(l === "day" ? dayL.length : nightL.length) ? "disabled" : ""}
          >${l === "base" ? "morning / base" : l}</button>`).join("")}
    </div>
    ${LAYER !== "base" ? `<div class="note" style="margin-bottom:6px">
      ${LAYER} replaces slots 2 and 3 only — at most 20% of the table.</div>` : ""}

    <table><thead><tr><th>slot</th><th>rate</th><th>species</th><th>level</th>
      <th title="tick what you have caught; every table's odds update">caught</th>
    </tr></thead><tbody id="slotrows"></tbody></table>

    <h2>merged view</h2>
    <div class="note" style="margin:-4px 0 4px">what a player meets. Edit by slot above —
      the merged view hides the ladder, and the ladder is the point.</div>
    <table>${merged}</table>`;

  const tb = $("#slotrows");
  d.slots.forEach(s => {
    const substituted = layerVals && (s.slot === 2 || s.slot === 3);
    const shownLabel = substituted ? layerVals[s.slot - 2] : s.label;
    const locked = LAYER !== "base" && !substituted;
    const tr = document.createElement("tr");
    if (s.caught) tr.className = "caught";
    tr.innerHTML = `<td class="num">${s.slot}</td><td class="num">${s.rate}%</td>
      <td class="spcell"></td>
      <td><input class="lv" type="number" min="1" max="100" value="${s.level}"
           ${LAYER !== "base" ? "disabled" : ""}></td>
      <td><input type="checkbox" class="ck" ${s.caught ? "checked" : ""}></td>`;
    const cell = tr.querySelector(".spcell");
    if (locked) {
      cell.innerHTML = `<span class="note">${esc(shownLabel)}</span>`;
    } else {
      cell.appendChild(combobox(shownLabel, val => {
        if (LAYER === "base") write("slot", { slot: s.slot, species: val });
        else write("time", { layer: LAYER, index: s.slot - 2, species: val });
      }));
    }
    tr.querySelector("input.lv").onchange = ev =>
      write("slot", { slot: s.slot, level: +ev.target.value });
    tr.querySelector("input.ck").onchange = ev =>
      setCaught(s.species, ev.target.checked);
    tb.appendChild(tr);
  });

  document.querySelectorAll("#mid-body .tabs button").forEach(b =>
    b.onclick = () => { LAYER = b.dataset.layer; drawMid(); });
  $("#rate").onchange = e => write("rate", { land_rate: +e.target.value });
}

// ---- right --------------------------------------------------------------

function drawRight() {
  const d = DETAIL;
  if (!d) { $("#right-body").innerHTML = "&nbsp;"; return; }
  const m = d.metrics, c = d.caught_metrics, t = GAME.thresholds;
  const upOk = m.uplift_on_rarest >= t.r3_uplift_min;

  const rungs = d.rungs.map(r => {
    const body = r.pool.map(p => `<span style="margin-right:9px" class="${p.caught ? "note" : ""}">
        ${p.caught ? `<s>${esc(p.label)}</s>`
                   : `${esc(p.label)} ${pct(p.share)}${
                       CAUGHT.size && p.cond != null && p.cond !== p.share
                         ? ` <span class="note">(${pct(p.cond)})</span>` : ""}`}
      </span>`).join("");
    const live = r.pool.filter(p => !p.caught).length;
    return `<div class="rung"><div class="hd">lead ${r.level}
      <span class="pill">${r.pool.length} species${live !== r.pool.length ? `, ${live} left` : ""}</span>
      ${CAUGHT.size ? `<span class="pill">${
        isFinite(r.throughput) ? r.throughput.toFixed(2) + " enc / counting" : "nothing left"}</span>` : ""}
      </div><div>${body}</div></div>`;
  }).join("");

  const findings = d.findings.length ? d.findings.map(f =>
    `<div class="finding ${f.severity}"><span class="rule">${f.rule}</span>
      ${esc(f.message)}
      ${["R3","R5","R11b","R13"].includes(f.rule) ? '<span class="asp">[aspirational]</span>' : ""}
     </div>`).join("") : `<div class="note">clean</div>`;

  $("#right-body").innerHTML = `
    <h2>repel</h2>
    <div class="big ${upOk ? "good" : "bad"}">${m.uplift_on_rarest.toFixed(2)}x</div>
    <div class="note">on ${esc(d.rarest_label || "-")}, the rarest
      ${m.uplift_at_level ? `— lead level ${m.uplift_at_level}` : "— no repel helps it"}
      (target ${t.r3_uplift_min}x)</div>
    <div class="note" style="margin-top:3px">best manip
      <b>${m.best_uplift.toFixed(2)}x</b> on ${esc(d.best_uplift_label || "-")}</div>

    <h2>still missing here</h2>
    ${c.live_species === 0
      ? `<div class="note">everything on this table is caught</div>`
      : `<div class="note"><b>${c.live_species}</b> of ${m.n_species} species left.
         Rarest still missing is <b>${esc(c.target ? (d.merged.find(x => x.species === c.target) || {}).label || "-" : "-")}</b>
         at <b>${pct(c.best_share)}</b>${c.best_level ? ` with a level-${c.best_level} lead` : " at base odds"}.
         ${isFinite(c.base_throughput) ? `About ${c.base_throughput.toFixed(1)} encounters per one that counts.` : ""}</div>`}

    <h2>ladder</h2>
    ${rungs || '<div class="note">one rung</div>'}

    <h2>shape</h2>
    <div class="note">${m.n_species} species · top ${pct(m.top_share)} ·
      HHI ${m.hhi.toFixed(3)} · ${m.rung_count} rungs · pools ${m.pool_sizes.join("/")}
      ${m.has_real_tail ? "· real tail" : "· duplicate tail"}</div>
    <div class="note">signature ${m.signature.join("/")}</div>

    <h2>lint</h2>
    ${findings}`;
}

// ---- actions ------------------------------------------------------------

async function setCaught(species, caught) {
  try {
    const r = await api("/api/caught", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ species, caught }) });
    CAUGHT = new Set(r.caught);
    toast(caught ? "caught" : "released");
    await Promise.all([reloadDetail(), refreshList()]);
  } catch (e) { toast(e.message, true); }
}

async function clearCaught() {
  try {
    const r = await api("/api/caught", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ clear: true }) });
    CAUGHT = new Set(r.caught);
    toast("caught list cleared");
    await Promise.all([reloadDetail(), refreshList()]);
  } catch (e) { toast(e.message, true); }
}

async function write(kind, body) {
  try {
    DETAIL = await api(`/api/area/${SEL}/${kind}`,
      { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body) });
    toast(DETAIL.changed ? "saved" : "no change");
    drawMid(); drawRight();
    await refreshList();
  } catch (e) {
    toast(e.message, true);
    select(SEL);
  }
}

async function reloadDetail() {
  if (!SEL) return;
  DETAIL = await api(`/api/area/${SEL}`);
  drawMid(); drawRight();
}

async function select(name) {
  SEL = name; LAYER = "base";
  try {
    DETAIL = await api(`/api/area/${name}`);
    drawMid(); drawRight(); drawList();
  } catch (e) { toast(e.message, true); }
}

async function refreshList() {
  GAME = await api("/api/areas");
  ALL = GAME.rows;
  drawHeader(); drawList();
}

async function boot() {
  try {
    const [areas, dex, caught] = await Promise.all([
      api("/api/areas"), api("/api/species"), api("/api/caught")]);
    GAME = areas; ALL = areas.rows;
    DEX = dex.species;
    BY_LABEL = new Map(DEX.map(d => [d.label.toLowerCase(), d.value]));
    CAUGHT = new Set(caught.caught);
    drawHeader(); drawList();
  } catch (e) {
    $("#rows").innerHTML = `<div class="note">${esc(e.message)}</div>`;
  }
}

$("#filter").oninput = drawList;
document.querySelectorAll("#sort a").forEach(a => a.onclick = ev => {
  ev.preventDefault(); SORT = a.dataset.k; drawList();
});
$("#clear-caught").onclick = ev => { ev.preventDefault(); clearCaught(); };
boot();
</script>
</body>
